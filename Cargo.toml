[workspace]
members = ["crates/habit-kernel-core"]

[workspace.package]
edition = "2024"
rust-version = "1.98.0"
authors = ["0xDimay <HexDimay@yandex.ru>"]
license = "Apache-2.0"
readme = "README.md"
version = "0.0.1"


[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.104"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }